[package]
name = "grpcping"
version = "0.1.0"
edition = "2021"
description = "A grpcurl-equivalent for Rust: lists services and makes dynamic unary gRPC calls via server reflection, no generated client stubs needed"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/grpcping"
readme = "README.md"
keywords = ["grpc", "reflection", "cli", "protobuf", "grpcurl"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "grpcping"
path = "src/lib.rs"

[[bin]]
name = "grpcping"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[build-dependencies]
tonic-build = "0.12"
